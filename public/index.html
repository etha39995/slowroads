<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slowroads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #hint {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      opacity: 0.5;
      color: white;
      z-index: 10;
    }
  </style>
</head>
<body>

  <iframe
    src="https://slowroads.io"
    allow="fullscreen; gamepad; autoplay"
    allowfullscreen>
  </iframe>

  <div id="hint">Press F11 for fullscreen</div>

</body>
</html>
